permissions:
  contents: read

jobs:
  parcel-database:
    name: Parcel database (${{ matrix.postgres }})
    runs-on: ubuntu-latest
    timeout-minutes: 5
    strategy:
      fail-fast: false
      matrix:
        postgres: [15, 17]
    services:
      postgres:
        image: postgres:${{ matrix.postgres }}
        env:
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: disposable-parcel-test
          POSTGRES_DB: scanner_parcel_test
        ports: ['5432:5432']
        options: >-
          --health-cmd pg_isready
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
    steps:
      - uses: actions/checkout@v4
      - name: Actual parcel migration and role regressions
        env:
          PGPASSWORD: disposable-parcel-test
        run: >-
          psql --host localhost --username postgres --dbname scanner_parcel_test
          --set ON_ERROR_STOP=1
          --file scripts/scanner-parcel/fixture.sql
          --file supabase/migrations/20260914170000_scanner_parcel_command_v1.sql
          --file scripts/scanner-parcel/assertions.sql
  contract:
    name: Planning → Scanner read contract v1
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - name: Critical production dependency audit
        run: npm run scanner:production-audit
      - name: Contract tests
        run: >-
          npx vitest run --environment node
          src/__tests__/scannerReadContractV1.test.ts
          src/__tests__/wmsPackingListSync.test.ts
          src/__tests__/scannerLegacyAuth.test.ts
          src/__tests__/scannerSignedAuth.test.ts
          src/__tests__/scannerCors.test.ts
          src/__tests__/scannerWmsPackingProjection.test.ts
          src/__tests__/scannerBundleProjection.test.ts
          src/__tests__/scannerWmsProjectionWiring.test.ts
          src/__tests__/scannerDeployPreflight.test.ts
          src/__tests__/scannerDeploymentChain.test.ts
          src/__tests__/scannerContractResponse.test.ts
          src/__tests__/scannerDependencyPin.test.ts
          src/__tests__/scannerReturnGateway.test.ts
          src/__tests__/scannerReturnApi.test.ts
          src/__tests__/scannerCommandGateway.test.ts
          src/__tests__/scannerParcelContract.test.ts
          src/__tests__/scannerParcelAuth.test.ts
          src/__tests__/scannerParcelGateway.static.test.ts
          src/__tests__/scannerTimeWmsPackingQuantity.test.ts
      - name: Contract lint
        run: >-
          npx eslint
          supabase/functions/_shared/scannerReadContractV1.ts
          supabase/functions/_shared/scannerLegacyAuth.ts
          supabase/functions/_shared/scannerSignedAuth.ts
          supabase/functions/_shared/scannerCors.ts
          supabase/functions/_shared/scannerWmsPackingProjection.ts
          supabase/functions/_shared/scannerReturnGateway.ts
          supabase/functions/scanner-return-api/index.ts
          supabase/functions/scanner-return-read-api/index.ts
          supabase/functions/_shared/scannerCommandGateway.ts
          supabase/functions/_shared/scannerParcelContract.ts
          supabase/functions/_shared/scannerParcelAuth.ts
          supabase/functions/_shared/scannerHubAccess.ts
          supabase/functions/scanner-parcel-api/index.ts
          supabase/functions/_shared/scannerTimeWmsPacking.ts
          supabase/functions/_shared/scannerBundleProjection.ts
          src/__tests__/scannerReadContractV1.test.ts
          src/__tests__/scannerLegacyAuth.test.ts
          src/__tests__/scannerSignedAuth.test.ts
          src/__tests__/scannerCors.test.ts
          src/__tests__/scannerWmsPackingProjection.test.ts
          src/__tests__/scannerBundleProjection.test.ts
          src/__tests__/scannerWmsProjectionWiring.test.ts
          src/__tests__/scannerDeployPreflight.test.ts
          src/__tests__/scannerDeploymentChain.test.ts
          src/__tests__/scannerContractResponse.test.ts
          src/__tests__/scannerDependencyPin.test.ts
          scripts/scanner-deploy-preflight.mjs
          supabase/functions/scanner-command-api/index.ts
          src/__tests__/scannerReturnGateway.test.ts
          src/__tests__/scannerReturnApi.test.ts
          src/__tests__/scannerCommandGateway.test.ts
          src/__tests__/scannerParcelContract.test.ts
          src/__tests__/scannerParcelAuth.test.ts
          src/__tests__/scannerParcelGateway.static.test.ts
          src/__tests__/scannerTimeWmsPackingQuantity.test.ts
      - name: Production build
        run: npm run build
