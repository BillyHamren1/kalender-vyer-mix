name: Scanner read contract

on:
  push:
    branches: [main]
    paths:
      - package.json
      - package-lock.json
      - bun.lock
      - src/__tests__/scannerReadContractV1.test.ts
      - src/__tests__/wmsPackingListSync.test.ts
      - src/__tests__/scannerLegacyAuth.test.ts
      - src/__tests__/scannerSignedAuth.test.ts
      - src/__tests__/scannerCors.test.ts
      - src/__tests__/scannerWmsPackingProjection.test.ts
      - src/__tests__/scannerWmsProjectionWiring.test.ts
      - src/__tests__/scannerDeployPreflight.test.ts
      - src/__tests__/scannerContractResponse.test.ts
      - src/__tests__/scannerDependencyPin.test.ts
      - supabase/functions/_shared/scannerReadContractV1.ts
      - supabase/functions/_shared/scannerLegacyAuth.ts
      - supabase/functions/_shared/scannerSignedAuth.ts
      - supabase/functions/_shared/scannerCors.ts
      - supabase/functions/_shared/scannerWmsPackingProjection.ts
      - supabase/functions/mobile-app-auth/index.ts
      - supabase/functions/scanner-api/index.ts
      - scripts/scanner-deploy-preflight.mjs
      - supabase/scanner-read-pilot-release-v1.json
      - .github/workflows/scanner-read-contract.yml
  pull_request:
    paths:
      - package.json
      - package-lock.json
      - bun.lock
      - src/__tests__/scannerReadContractV1.test.ts
      - src/__tests__/wmsPackingListSync.test.ts
      - src/__tests__/scannerLegacyAuth.test.ts
      - src/__tests__/scannerSignedAuth.test.ts
      - src/__tests__/scannerCors.test.ts
      - src/__tests__/scannerWmsPackingProjection.test.ts
      - src/__tests__/scannerWmsProjectionWiring.test.ts
      - src/__tests__/scannerDeployPreflight.test.ts
      - src/__tests__/scannerContractResponse.test.ts
      - src/__tests__/scannerDependencyPin.test.ts
      - supabase/functions/_shared/scannerReadContractV1.ts
      - supabase/functions/_shared/scannerLegacyAuth.ts
      - supabase/functions/_shared/scannerSignedAuth.ts
      - supabase/functions/_shared/scannerCors.ts
      - supabase/functions/_shared/scannerWmsPackingProjection.ts
      - supabase/functions/mobile-app-auth/index.ts
      - supabase/functions/scanner-api/index.ts
      - scripts/scanner-deploy-preflight.mjs
      - supabase/scanner-read-pilot-release-v1.json
      - .github/workflows/scanner-read-contract.yml

permissions:
  contents: read

jobs:
  contract:
    name: Planning → Scanner read contract v1
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - name: Critical production dependency audit
        run: npm run scanner:production-audit
      - name: Contract tests
        run: >-
          npx vitest run --environment node
          src/__tests__/scannerReadContractV1.test.ts
          src/__tests__/wmsPackingListSync.test.ts
          src/__tests__/scannerLegacyAuth.test.ts
          src/__tests__/scannerSignedAuth.test.ts
          src/__tests__/scannerCors.test.ts
          src/__tests__/scannerWmsPackingProjection.test.ts
          src/__tests__/scannerWmsProjectionWiring.test.ts
          src/__tests__/scannerDeployPreflight.test.ts
          src/__tests__/scannerContractResponse.test.ts
          src/__tests__/scannerDependencyPin.test.ts
      - name: Contract lint
        run: >-
          npx eslint
          supabase/functions/_shared/scannerReadContractV1.ts
          supabase/functions/_shared/scannerLegacyAuth.ts
          supabase/functions/_shared/scannerSignedAuth.ts
          supabase/functions/_shared/scannerCors.ts
          supabase/functions/_shared/scannerWmsPackingProjection.ts
          src/__tests__/scannerReadContractV1.test.ts
          src/__tests__/scannerLegacyAuth.test.ts
          src/__tests__/scannerSignedAuth.test.ts
          src/__tests__/scannerCors.test.ts
          src/__tests__/scannerWmsPackingProjection.test.ts
          src/__tests__/scannerWmsProjectionWiring.test.ts
          src/__tests__/scannerDeployPreflight.test.ts
          src/__tests__/scannerContractResponse.test.ts
          src/__tests__/scannerDependencyPin.test.ts
          scripts/scanner-deploy-preflight.mjs
      - name: Production build
        run: npm run build
