name: Operations whole scope grant native prerequisite
on:
  pull_request:
    paths:
      - 'scripts/project-economy/**'
      - 'supabase/migrations/**'
      - 'supabase/functions/_shared/**'
      - 'docs/project-economy/whole-scope-grant-native-proof-v1.md'
      - '.github/workflows/operations-whole-scope-grant-native.yml'
permissions:
  contents: read
jobs:
  actual-grant-metadata-caller-and-concurrency:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    services:
      postgres:
        image: postgres:15.19
        env:
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: synthetic-test-only
          POSTGRES_DB: eventflow_scope_product_publication_runtime
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -h 127.0.0.1 -U postgres -d eventflow_scope_product_publication_runtime"
          --health-interval 2s --health-timeout 3s --health-retries 20
    env:
      CI: 'true'
      PGHOST: 127.0.0.1
      PGPORT: '5432'
      PGDATABASE: eventflow_scope_product_publication_runtime
      PGUSER: postgres
      PGPASSWORD: synthetic-test-only
      EVENTFLOW_WHOLE_SCOPE_GRANT_ISOLATED_DB: 'true'
      PYTHONDONTWRITEBYTECODE: '1'
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: denoland/setup-deno@v2
        with:
          deno-version: 2.8.1
      - name: Exact candidate and owned resource denial controls
        run: |
          set -euo pipefail
          umask 077
          test "$(git rev-parse HEAD)" = "$GITHUB_SHA"
          git diff --exit-code
          test -z "$(git status --porcelain --untracked-files=normal)"
          python3 -I -B scripts/project-economy/operations-whole-scope-grant-native-guard-test.py
          deno check --no-config --no-lock --no-remote --no-npm scripts/project-economy/operations-obligation-fixture.ts scripts/project-economy/whole-scope-product-grant-caller-controls.ts scripts/project-economy/whole-scope-product-grant-event-sql-parity.ts
      - name: Genuine native grant metadata rights and reverse concurrency
        run: |
          set -euo pipefail
          umask 077
          git rev-parse HEAD
          python3 --version
          PGCONNECT_TIMEOUT=5 PGOPTIONS='-c statement_timeout=5000' psql -X --no-password -At -c 'select version()'
          deno --version
          env -u HTTP_PROXY -u HTTPS_PROXY -u ALL_PROXY -u NO_PROXY -u http_proxy -u https_proxy -u all_proxy -u no_proxy python3 -I -B scripts/project-economy/operations-whole-scope-grant-native-runner.py
          git diff --exit-code
          test -z "$(git status --porcelain --untracked-files=normal)"
