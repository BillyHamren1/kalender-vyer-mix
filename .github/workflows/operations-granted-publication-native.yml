name: Operations grant-bound physical publication native proof
on:
  pull_request:
    paths:
      - 'scripts/project-economy/**'
      - 'supabase/migrations/**'
      - 'supabase/functions/_shared/**'
      - 'docs/project-economy/whole-scope-grant-publication-successor-native-proof-v2.md'
      - '.github/workflows/operations-granted-publication-native.yml'
permissions:
  contents: read
jobs:
  actual-grant-bound-publication-history-and-causal-queues:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    services:
      postgres:
        image: postgres:15.19
        env:
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: synthetic-test-only
          POSTGRES_DB: eventflow_scope_product_publication_runtime
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -h 127.0.0.1 -U postgres -d eventflow_scope_product_publication_runtime"
          --health-interval 2s --health-timeout 3s --health-retries 20
    env:
      CI: 'true'
      PGHOST: 127.0.0.1
      PGPORT: '5432'
      PGDATABASE: eventflow_scope_product_publication_runtime
      PGUSER: postgres
      PGPASSWORD: synthetic-test-only
      EVENTFLOW_WHOLE_SCOPE_GRANTED_PUBLICATION_ISOLATED_DB: 'true'
      PYTHONDONTWRITEBYTECODE: '1'
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: denoland/setup-deno@v2
        with:
          deno-version: '2.8.1'
      - name: Exact finite source before guards or isolated database mutation
        run: |
          set -euo pipefail
          umask 077
          test "$(git rev-parse HEAD)" = "$GITHUB_SHA"
          git diff --exit-code
          test -z "$(git status --porcelain --untracked-files=normal)"
          python3 -I -B - <<'PY_GRANTED_SOURCE'
          import hashlib,pathlib
          locked={'docs/project-economy/whole-scope-grant-publication-successor-native-proof-v2.md': {'sha256': 'c6d8565c96ce0a3feaa0e1c1d96fee58be2965259abbbe67b7e76cba93ca490c', 'bytes': 7080}, 'scripts/project-economy/whole-scope-grant-publication-successor-native-cases.py': {'sha256': '342f2bcb75f5fb8539227379fbb877bc002827fa887233768ffb5eed329b564e', 'bytes': 17633}, 'scripts/project-economy/whole-scope-grant-publication-successor-native-closure.json': {'sha256': 'beffb5a5ab81b51c12ac5a9e3488f53bada03d0106b5e912b3e79fb02504a96c', 'bytes': 18881}, 'scripts/project-economy/whole-scope-grant-publication-successor-native-guard-test.py': {'sha256': '08db8707e4745e6b286e05d83d3b55ccafd1b0b52072d1a2890469a0bf6f8e6c', 'bytes': 21191}, 'scripts/project-economy/whole-scope-grant-publication-successor-native-owned-processes.py': {'sha256': '0c4b2cc9474c805986e4e22193a41641f6af4a76034e4f41c0a973d595841aac', 'bytes': 7874}, 'scripts/project-economy/whole-scope-grant-publication-successor-native-runner.py': {'sha256': 'e022ae1760e89c054bc5e81054cee383de03ace16bcd438e5517a5e8ef7b916f', 'bytes': 24155}, 'scripts/project-economy/whole-scope-grant-publication-successor-native-setup.sql': {'sha256': 'bbfa3215aab11de16a41d17bad9d426675dc4dbfd1c7c808bd168fcb96bb88f0', 'bytes': 2706}}
          for name,row in locked.items():
            path=pathlib.Path(name)
            if path.is_symlink() or not path.is_file():raise SystemExit("GRANTED_PUBLICATION_NATIVE_SOURCE_DENIED")
            raw=path.read_bytes()
            if len(raw)!=row["bytes"] or hashlib.sha256(raw).hexdigest()!=row["sha256"]:raise SystemExit("GRANTED_PUBLICATION_NATIVE_SOURCE_DENIED")
          PY_GRANTED_SOURCE
          python3 -I -B scripts/project-economy/whole-scope-grant-publication-successor-native-guard-test.py
          deno check --no-config --no-lock --no-remote --no-npm scripts/project-economy/whole-scope-grant-publication-successor-caller-controls.ts scripts/project-economy/whole-scope-grant-publication-successor-sql-parity.ts
          deno test --no-config --no-lock --no-remote --no-npm supabase/functions/_shared/whole-scope-grant-publication-successor-command-v2.deno-test.ts
          deno test --no-config --no-lock --no-remote --no-npm --allow-read --allow-write --allow-sys=uid --allow-run=/usr/bin/mkfifo scripts/project-economy/whole-scope-grant-publication-successor-sql-parity.guard-test.ts
      - name: Actual same physical history, grant rights, exact receipts and causal concurrency
        run: |
          set -euo pipefail
          umask 077
          git rev-parse HEAD
          python3 --version
          deno --version
          PGCONNECT_TIMEOUT=5 PGOPTIONS='-c statement_timeout=5000' psql -X --no-password -At -c 'select version()'
          env -u HTTP_PROXY -u HTTPS_PROXY -u ALL_PROXY -u NO_PROXY -u http_proxy -u https_proxy -u all_proxy -u no_proxy python3 -I -B scripts/project-economy/whole-scope-grant-publication-successor-native-runner.py
          git diff --exit-code
          test -z "$(git status --porcelain --untracked-files=normal)"
