name: Canonical booking costs
on:
  pull_request:
    paths:
      - 'src/components/project/**'
      - 'src/hooks/use*ProjectEconomy.tsx'
      - 'src/services/*Cost*'
      - 'src/services/planningApiService.ts'
      - 'src/services/projectEconomyService.ts'
      - 'src/lib/economy/bookingCosts.ts'
      - 'supabase/functions/planning-api-proxy/**'
      - '.github/workflows/canonical-booking-costs.yml'
  workflow_dispatch:
permissions:
  contents: read
jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
          cache: npm
      - run: npm ci
      - run: npx vitest run src/components/project/BookingCostsPanel.test.tsx src/services/__tests__/bookingCostSource.test.ts
      - run: npx tsc --noEmit -p tsconfig.app.json
        env:
          NODE_OPTIONS: --max-old-space-size=6144
      - run: npm run build
        env:
          NODE_OPTIONS: --max-old-space-size=6144
