name: Internal projects exact-head verification
on:
  pull_request:
    paths:
      - 'src/**'
      - 'supabase/migrations/**'
      - 'supabase/functions/**'
      - 'scripts/internal-projects/**'
      - 'tests/**'
      - 'package*.json'
      - '*config*'
      - '.github/workflows/internal-projects.yml'
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: internal-projects-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true
jobs:
  application:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    env:
      NODE_OPTIONS: --max-old-space-size=6144
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.event.pull_request.head.sha || github.sha }}
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
      - run: npm ci
      - name: Record exact source
        run: git rev-parse HEAD
      - name: Internal project and warehouse regressions
        run: >-
          npx vitest run
          src/lib/projects/__tests__/projectKind.test.ts
          src/features/time-v2/__tests__/internalProjectProjection.test.ts
          src/services/__tests__/internalStatusBoundary.test.ts
          src/services/__tests__/internalWarehouseInboxBoundary.test.ts
          src/services/__tests__/internalProjectCreation.test.ts
          src/services/__tests__/internalWarehouseIdentityService.test.ts
          src/hooks/__tests__/useInternalLagerCalendarEvents.test.tsx
          src/components/project/__tests__/InternalProjectFollowup.test.ts
          src/components/project/__tests__/InternalProjectFollowup.close.test.tsx
          src/components/project/__tests__/InternalProjectFollowup.render.test.tsx
          src/__tests__/warehouseArticleLocations.contract.test.ts
          src/test/messagingProduct.contract.test.ts
      - run: npx tsc --noEmit -p tsconfig.app.json
      - run: npm run build
      - name: Install isolated PGlite regression runtime
        run: npm install --prefix "$RUNNER_TEMP/internal-sql" --no-save --package-lock=false @electric-sql/pglite@0.5.9
      - name: Existing isolated migration regression scenarios
        env:
          PGLITE_MODULE: ${{ runner.temp }}/internal-sql/node_modules/@electric-sql/pglite/dist/index.js
        run: |
          node scripts/internal-projects/database.test.mjs
          node scripts/internal-projects/atomic-create.test.mjs
          node scripts/internal-projects/project-metadata-outbox.test.mjs
  postgres-concurrency:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    services:
      postgres:
        image: postgres:17
        env:
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: disposable-ci-only
          POSTGRES_DB: internal_projects_ci
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U postgres -d internal_projects_ci"
          --health-interval 5s --health-timeout 5s --health-retries 10
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.event.pull_request.head.sha || github.sha }}
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: python -m pip install 'psycopg[binary]==3.2.9'
      - name: Real PostgreSQL overlapping sessions against synthetic schema
        env:
          INTERNAL_PROJECTS_TEST_DSN: postgresql://postgres:disposable-ci-only@127.0.0.1:5432/internal_projects_ci
        run: python scripts/internal-projects/postgres-concurrency.py
