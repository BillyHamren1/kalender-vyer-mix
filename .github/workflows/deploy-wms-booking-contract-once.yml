name: Deploy WMS Booking contract once

on:
  push:
    branches:
      - main
    paths:
      - ".github/workflows/deploy-wms-booking-contract-once.yml"

permissions:
  contents: read

concurrency:
  group: wms-booking-contract-production
  cancel-in-progress: false

jobs:
  deploy:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    env:
      BUNDLE_PROJECT_REF: pnvvnvywphfvmwdmqqzs
    steps:
      - uses: actions/checkout@v4
      - name: Require production credential
        env:
          SUPABASE_ACCESS_TOKEN: ${{ secrets.SUPABASE_ACCESS_TOKEN }}
        run: test -n "$SUPABASE_ACCESS_TOKEN"
      - name: Restore exact merged WMS function bundle
        working-directory: ${{ runner.temp }}
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p wms-booking-contract/supabase
          cd wms-booking-contract/supabase
          printf '%s\n' 'project_id = "pnvvnvywphfvmwdmqqzs"' > config.toml
          mkdir -p "$(dirname 'functions/create-reservation/index.ts')"
          printf '%s' '' | base64 --decode > 'functions/create-reservation/index.ts'
          mkdir -p "$(dirname 'functions/update-reservation/index.ts')"
          printf '%s' '' | base64 --decode > 'functions/update-reservation/index.ts'
          mkdir -p "$(dirname 'functions/get-packing-list/index.ts')"
          printf '%s' '' | base64 --decode > 'functions/get-packing-list/index.ts'
          mkdir -p "$(dirname 'functions/_shared/reserve-inventory.ts')"
          printf '%s' '' | base64 --decode > 'functions/_shared/reserve-inventory.ts'
          mkdir -p "$(dirname 'functions/_shared/reservation-response.ts')"
          printf '%s' '' | base64 --decode > 'functions/_shared/reservation-response.ts'
          mkdir -p "$(dirname 'functions/_shared/item-type-mapping.ts')"
          printf '%s' '' | base64 --decode > 'functions/_shared/item-type-mapping.ts'
          mkdir -p "$(dirname 'functions/_shared/reservation-line-integrity.ts')"
          printf '%s' '' | base64 --decode > 'functions/_shared/reservation-line-integrity.ts'
          mkdir -p "$(dirname 'functions/_shared/packing-quota.ts')"
          printf '%s' '' | base64 --decode > 'functions/_shared/packing-quota.ts'

      - name: Deploy WMS writer and packing reader
        working-directory: ${{ runner.temp }}/wms-booking-contract/supabase
        env:
          SUPABASE_ACCESS_TOKEN: ${{ secrets.SUPABASE_ACCESS_TOKEN }}
        run: |
          set -euo pipefail
          for function_name in create-reservation update-reservation get-packing-list; do
            npx --yes supabase@2.117.0 functions deploy "$function_name" --project-ref "$BUNDLE_PROJECT_REF" --no-verify-jwt
          done
      - name: Confirm deployed functions
        env:
          SUPABASE_ACCESS_TOKEN: ${{ secrets.SUPABASE_ACCESS_TOKEN }}
        run: |
          set -euo pipefail
          deployed="$(npx --yes supabase@2.117.0 functions list --project-ref "$BUNDLE_PROJECT_REF")"
          grep -q "create-reservation" <<<"$deployed"
          grep -q "update-reservation" <<<"$deployed"
          grep -q "get-packing-list" <<<"$deployed"
