name: Accepted personnel caller isolation
on:
  pull_request:
    paths:
      - 'supabase/functions/_shared/project-personnel-*.ts'
      - 'supabase/functions/project-personnel-cost-publish/*'
      - 'supabase/migrations/*operations_personnel*.sql'
      - 'supabase/migrations/20261012124216_internal_project_classification.sql'
      - 'scripts/internal-projects/accepted-rate-*.mjs'
      - 'scripts/internal-projects/accepted-personnel-*.sql'
      - 'scripts/internal-projects/accepted-personnel-review*.mjs'
      - 'scripts/internal-projects/personnel-*'
      - 'scripts/project-economy/operations-project-review-bootstrap.sql'
      - '.github/workflows/operations-accepted-caller.yml'
  push:
    branches:
      - 'codex/project-economy-personnel-cost'
    paths:
      - 'supabase/functions/_shared/project-personnel-*.ts'
      - 'supabase/functions/project-personnel-cost-publish/*'
      - 'supabase/migrations/*operations_personnel*.sql'
      - 'supabase/migrations/20261012124216_internal_project_classification.sql'
      - 'scripts/internal-projects/accepted-rate-*.mjs'
      - 'scripts/internal-projects/accepted-personnel-*.sql'
      - 'scripts/internal-projects/accepted-personnel-review*.mjs'
      - 'scripts/internal-projects/personnel-*'
      - 'scripts/project-economy/operations-project-review-bootstrap.sql'
      - '.github/workflows/operations-accepted-caller.yml'
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: accepted-personnel-caller-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true
jobs:
  accepted-caller:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    # Dedicated service: the native harness requires an empty public schema and
    # no pre-existing auth roles. Never reset another suite's service database.
    services:
      postgres:
        image: postgres:17
        env:
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: disposable-ci-only
          POSTGRES_DB: accepted_personnel_cost_ci
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U postgres -d accepted_personnel_cost_ci"
          --health-interval 5s --health-timeout 5s --health-retries 10
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.event.pull_request.head.sha || github.sha }}
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
      - name: Record exact source
        run: git rev-parse HEAD
      - name: Install isolated pinned dependencies
        run: npm install --prefix "$RUNNER_TEMP/accepted-caller-test" --no-save --package-lock=false @electric-sql/pglite@0.5.9 typescript@5.6.3 pg@8.16.3 vitest@4.1.11
      - name: Link isolated dependencies
        run: ln -s "$RUNNER_TEMP/accepted-caller-test/node_modules" node_modules
      - name: Composed accepted caller oracle in PGlite
        run: node scripts/internal-projects/personnel-caller.test.mjs
      - name: PostgreSQL 17 caller ownership and physical first-day overlaps
        env:
          INTERNAL_PROJECTS_TEST_DSN: postgresql://postgres:disposable-ci-only@127.0.0.1:5432/accepted_personnel_cost_ci
        run: node scripts/internal-projects/personnel-caller.test.mjs
      - name: Actual publisher and issuer caller tests
        run: node_modules/.bin/vitest run --config scripts/internal-projects/personnel-vitest.config.mjs
      - name: Typecheck actual handler dependency closure
        run: node_modules/.bin/tsc --noEmit --allowImportingTsExtensions --moduleResolution bundler --module esnext --target es2022 --lib es2022,dom --skipLibCheck supabase/functions/project-personnel-cost-publish/handler.ts
