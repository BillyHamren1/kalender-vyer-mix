name: Packing write authority
on:
  pull_request:
    paths:
      - 'supabase/functions/**'
      - 'supabase/migrations/**'
      - 'scripts/authz-regression/**'
      - '.github/workflows/packing-write-authority.yml'
jobs:
  authority:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '24.22.1'
      - run: npm ci --prefix scripts/authz-regression
      - run: node scripts/authz-regression/packing-write.test.mjs
      - run: node --test scripts/authz-regression/packing-module-access.test.mjs
