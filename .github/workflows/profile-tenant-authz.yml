name: Profile tenant authorization regression
on:
  pull_request:
    paths:
      - 'supabase/migrations/**'
      - 'scripts/authz-regression/**'
      - '.github/workflows/profile-tenant-authz.yml'
  workflow_dispatch:
permissions:
  contents: read
jobs:
  postgres-fixture:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - run: npm ci --ignore-scripts
        working-directory: scripts/authz-regression
      - run: npm test
        working-directory: scripts/authz-regression
