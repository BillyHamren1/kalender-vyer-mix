name: Operations credit and capacity reverse native proof
on:
  pull_request:
    paths:
      - 'scripts/project-economy/**'
      - 'supabase/migrations/**'
      - 'supabase/functions/_shared/**'
      - 'docs/project-economy/remaining-six-credit-capacity-reverse-native*'
      - '.github/workflows/operations-credit-capacity-reverse-native.yml'
permissions:
  contents: read
jobs:
  actual-reverse-receiver-and-owner:
    name: actual-reverse-${{ matrix.mode }}
    runs-on: ubuntu-latest
    timeout-minutes: 25
    strategy:
      fail-fast: false
      matrix:
        include:
          - mode: credit
            database: eventflow_own_credit_reverse_remaining_six
          - mode: capacity
            database: eventflow_own_credit_capacity_reverse_remaining_six
    services:
      postgres:
        image: postgres:15.19
        env:
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: synthetic-test-only
          POSTGRES_DB: ${{ matrix.database }}
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -h 127.0.0.1 -U postgres -d ${{ matrix.database }}"
          --health-interval 2s --health-timeout 3s --health-retries 20
    env:
      CI: 'true'
      PGHOST: 127.0.0.1
      PGPORT: '5432'
      PGDATABASE: ${{ matrix.database }}
      PGUSER: postgres
      PGPASSWORD: synthetic-test-only
      EVENTFLOW_REMAINING_SIX_CREDIT_CAPACITY_REVERSE_ISOLATED_DB: 'true'
      PYTHONDONTWRITEBYTECODE: '1'
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: denoland/setup-deno@v2
        with:
          deno-version: 2.8.1
      - name: Exact source fixture and reverse evidence denial controls
        run: |
          set -euo pipefail
          umask 077
          test "$(git rev-parse HEAD)" = "$GITHUB_SHA"
          git diff --exit-code
          test -z "$(git status --porcelain --untracked-files=normal)"
          python3 -I -B scripts/project-economy/remaining-six-credit-capacity-reverse-native.guard.test.py
          python3 -I -B scripts/project-economy/remaining-six-credit-capacity-reverse-native-evidence.test.py
          deno check --no-config --no-lock --no-remote --no-npm scripts/project-economy/operations-fixture.ts scripts/project-economy/operations-obligation-fixture.ts scripts/project-economy/operations-hired-personnel-native-fixture.ts
      - name: Genuine reverse blockers immutable history and first absent source
        run: |
          set -euo pipefail
          umask 077
          git rev-parse HEAD
          python3 --version
          PGCONNECT_TIMEOUT=5 PGOPTIONS='-c statement_timeout=5000' psql -X --no-password -At -c 'select version()'
          deno --version
          env -u HTTP_PROXY -u HTTPS_PROXY -u ALL_PROXY -u NO_PROXY -u http_proxy -u https_proxy -u all_proxy -u no_proxy python3 -I -B scripts/project-economy/remaining-six-credit-capacity-reverse-native.py
          git diff --exit-code
          test -z "$(git status --porcelain --untracked-files=normal)"
