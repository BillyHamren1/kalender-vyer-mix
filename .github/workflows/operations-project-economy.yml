          deno check --unstable-sloppy-imports scripts/project-economy/operations-scope-compatible-read-http-journey.ts scripts/project-economy/operations-scope-compatible-read-vector-test.ts scripts/project-economy/operations-obligation-fixture.ts
          deno cache --unstable-sloppy-imports scripts/project-economy/operations-scope-compatible-read-http-journey.ts scripts/project-economy/operations-scope-compatible-read-vector-test.ts scripts/project-economy/operations-obligation-fixture.ts
      - name: Actual public product readers signed JWT admission and authored queued writers
        id: compatible_runtime
        run: |
          set -euo pipefail
          umask 077
          git rev-parse HEAD
          psql -X --no-password -At -c 'select version()'
          [[ "$GITHUB_RUN_ID" =~ ^[0-9]{1,20}$ ]]
          [[ "$GITHUB_RUN_ATTEMPT" =~ ^[0-9]{1,10}$ ]]
          run_key="${GITHUB_RUN_ID}-${GITHUB_RUN_ATTEMPT}"
          registry="$RUNNER_TEMP/operations-compatible-read-owned-${run_key}.registry"
          immutable_parent="/tmp/operations-compatible-immutable-${run_key}"
          private_parent="/tmp/operations-compatible-reader-native-${run_key}"
          container_name="scope-compatible-read-http-${run_key}"
          test ! -e "$registry"
          test ! -e "$immutable_parent"
          test ! -e "$private_parent"
          test -z "$(docker --host unix:///var/run/docker.sock ps -a --filter "name=^/${container_name}$" --format '{{.Names}}')"
          env -u HTTP_PROXY -u HTTPS_PROXY -u ALL_PROXY -u NO_PROXY -u http_proxy -u https_proxy -u all_proxy -u no_proxy python3 -I -B - <<'PY_HELD_BOOTSTRAP' &
          # BEGIN HELD BOOTSTRAP LAUNCHER V2
          import hashlib,os,stat
          BOOTSTRAP_PATH='scripts/project-economy/operations-scope-compatible-read-native-pinned-postgrest.py'
          BOOTSTRAP_SHA256='f08ad27e09b51dcd2b800e32883f2e5316ec0903e75e435aff69bb7ecc748ea7'
          CLOSURE_PATH='scripts/project-economy/operations-scope-compatible-read-native-pinned-postgrest-closure.json'
          CLOSURE_SHA256='e1d2d677af718e12f6549d05e5c4ba197a9fca1744f207993ad41ea2af41896c'
          def identity(value):
              return (value.st_dev,value.st_ino,value.st_mode,value.st_uid,value.st_gid,value.st_nlink,value.st_size,value.st_mtime_ns,value.st_ctime_ns)
          def open_held(path,expected,maximum):
              fd=os.open(path,os.O_RDONLY|os.O_CLOEXEC|os.O_NOFOLLOW)
              try:
                  before=os.fstat(fd)
                  if not stat.S_ISREG(before.st_mode) or before.st_nlink!=1 or before.st_mode&0o022 or before.st_size>maximum:
                      raise RuntimeError('held_authority_refused')
                  chunks=[];offset=0
                  while True:
                      part=os.pread(fd,min(65536,maximum+1-offset),offset)
                      if not part:break
                      chunks.append(part);offset+=len(part)
                      if offset>maximum:raise RuntimeError('held_authority_refused')
                  data=b''.join(chunks);after=os.fstat(fd);current=os.stat(path,follow_symlinks=False)
                  if identity(before)!=identity(after) or identity(after)!=identity(current) or hashlib.sha256(data).hexdigest()!=expected:
                      raise RuntimeError('held_authority_refused')
                  return fd,identity(before),data
              except BaseException:
                  os.close(fd);raise
          def authority(value):return {'fd':value[0],'identity':value[1],'bytes':value[2]}
          outer_phase='outer_bootstrap_open'
          bootstrap=None;closure=None
          try:
              bootstrap=open_held(BOOTSTRAP_PATH,BOOTSTRAP_SHA256,131072)
              outer_phase='outer_closure_open'
              closure=open_held(CLOSURE_PATH,CLOSURE_SHA256,2097152)
              namespace={'__name__':'__main__','__file__':BOOTSTRAP_PATH,'__package__':None,'__held_bootstrap__':authority(bootstrap),'__held_closure__':authority(closure)}
              outer_phase='outer_compile'
              code=compile(bootstrap[2],'<held-bootstrap:'+BOOTSTRAP_SHA256+'>','exec',dont_inherit=True,optimize=0)
              outer_phase='outer_execute'
              exec(code,namespace,namespace)
          except BaseException as error:
              if type(error) is SystemExit:raise
              print('operations-scope-compatible-read-native FAIL source_closure PHASE='+outer_phase,file=__import__('sys').stderr)
              raise SystemExit(1) from None
          finally:
              try:
                  if closure is not None:os.close(closure[0])
                  if bootstrap is not None:os.close(bootstrap[0])
              except BaseException:
                  print('operations-scope-compatible-read-native FAIL source_closure PHASE=outer_close',file=__import__('sys').stderr)
                  raise SystemExit(1) from None
          # END HELD BOOTSTRAP LAUNCHER V2
          PY_HELD_BOOTSTRAP
          runtime_pid=$!
          if test -r "/proc/${runtime_pid}/stat"; then
            runtime_start="$(awk '{print $22}' "/proc/${runtime_pid}/stat")"
          else
            runtime_start=gone
          fi
          {
            printf 'immutable_parent\t%s\n' "$immutable_parent"
            printf 'private_parent\t%s\n' "$private_parent"
            printf 'process\t%s\t%s\n' "$runtime_pid" "$runtime_start"
            printf 'container\t%s\n' "$container_name"
            printf 'network\tnone\n'
          } > "$registry"
          wait "$runtime_pid"
          git diff --exit-code
          test -z "$(git status --porcelain --untracked-files=normal)"
      - name: Exact registered owned cleanup no-survivor
        if: ${{ always() && steps.compatible_runtime.outcome != 'skipped' }}
        run: |
          set -euo pipefail
          [[ "$GITHUB_RUN_ID" =~ ^[0-9]{1,20}$ ]]
          [[ "$GITHUB_RUN_ATTEMPT" =~ ^[0-9]{1,10}$ ]]
          run_key="${GITHUB_RUN_ID}-${GITHUB_RUN_ATTEMPT}"
          registry="$RUNNER_TEMP/operations-compatible-read-owned-${run_key}.registry"
          immutable_parent="/tmp/operations-compatible-immutable-${run_key}"
          private_parent="/tmp/operations-compatible-reader-native-${run_key}"
          container_name="scope-compatible-read-http-${run_key}"
          test -f "$registry"
          test "$(stat -c '%u:%a' "$registry")" = "$(id -u):600"
          mapfile -t owned < "$registry"
          test "${#owned[@]}" -eq 5
          test "${owned[0]}" = $'immutable_parent\t'"$immutable_parent"
          test "${owned[1]}" = $'private_parent\t'"$private_parent"
          IFS=$'\t' read -r process_kind runtime_pid runtime_start <<< "${owned[2]}"
          test "$process_kind" = process
          [[ "$runtime_pid" =~ ^[1-9][0-9]*$ ]]
          test -n "$runtime_start"
          test "${owned[3]}" = $'container\t'"$container_name"
          test "${owned[4]}" = $'network\tnone'
          test ! -e "$immutable_parent"
          test ! -e "$private_parent"
          if test "$runtime_start" != gone && test -e "/proc/${runtime_pid}"; then
            current_start="$(awk '{print $22}' "/proc/${runtime_pid}/stat")"
