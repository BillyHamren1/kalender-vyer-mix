name: Operations project economy synthetic runtime
on:
  pull_request:
    paths:
      - 'supabase/functions/_shared/project-personnel-*'
      - 'supabase/functions/_shared/finance-project-invoice*'
      - 'supabase/functions/_shared/project-cost-obligations*'
      - 'supabase/functions/_shared/project-obligation-credit-assignment*'
      - 'supabase/functions/_shared/project-obligation-credit-capacity*'
      - 'supabase/migrations/*operations_obligation_credit_capacity*.sql'
      - 'supabase/migrations/*operations_obligation_credit_assignment*.sql'
      - 'src/lib/economy/projectCateringEvidenceParity*'
      - 'src/lib/economy/projectScopeObligationEvidence*'
      - 'src/components/project/OperationsScopeObligationEvidencePanel*'
      - 'supabase/migrations/*operations_scope_obligation_evidence_read*.sql'
      - 'src/components/project/OperationsCateringEvidenceParityPanel*'
      - 'supabase/functions/_shared/project-cost-obligation-authority*'
      - 'supabase/functions/_shared/project-obligation-source-policy*'
      - 'supabase/functions/_shared/project-scope-obligation-composition*'
      - 'supabase/functions/_shared/project-credit-link-v2-destination*'
      - 'supabase/migrations/*operations_project_obligation*.sql'
      - 'supabase/migrations/*operations_obligation_source_policy*.sql'
      - 'supabase/migrations/*operations_scope_obligation_composition*.sql'
      - 'supabase/functions/_shared/project-operational-eac*'
      - 'supabase/functions/_shared/canonical-project-scope*'
      - 'supabase/migrations/*operations_project_scope*.sql'
      - 'supabase/migrations/*operations_project_forecast*.sql'
      - 'supabase/functions/_shared/catering-project-evidence*'
      - 'supabase/functions/_shared/catering-project-ingestion*'
      - 'supabase/functions/catering-project-cost-publish/**'
      - 'supabase/migrations/*operations_catering*.sql'
      - 'supabase/functions/project-personnel-cost-publish/**'
      - 'supabase/functions/finance-project-invoice-receive/**'
      - 'supabase/functions/finance-project-invoice-receive-v2/**'
      - 'supabase/functions/_shared/catering-finance-*'
      - 'supabase/functions/catering-finance-delivery/**'
      - 'supabase/migrations/*operations_finance_credit*.sql'
      - 'supabase/migrations/*operations_invoice_economic*.sql'
      - 'scripts/project-economy/catering-finance-*'
      - 'supabase/config.toml'
      - 'supabase/migrations/*operations_finance_project_invoice*.sql'
      - 'supabase/migrations/*operations_personnel*.sql'
      - 'supabase/migrations/*operations_project_cost_read.sql'
      - 'src/lib/economy/projectCostEvidence*'
      - 'src/lib/economy/projectNativeCostEvidence*'
      - 'src/components/project/NativeCateringCostEvidencePanel*'
      - 'src/components/project/ProjectEconomyTab.tsx'
      - 'supabase/functions/_shared/project-booking-commercial-read*'
      - 'supabase/migrations/*operations_project_cost_native_read*.sql'
      - 'src/components/project/ProjectCostEvidencePanel*'
      - 'scripts/project-economy/operations-*'
      - '.github/workflows/operations-project-economy.yml'
  workflow_dispatch:
permissions:
  contents: read
jobs:
  frozen-cost-contract:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:15.19
        env:
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: synthetic-test-only
          POSTGRES_DB: operations_economy_test
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U postgres"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5
    env:
      PGHOST: localhost
      PGPORT: 5432
      PGDATABASE: operations_economy_test
      PGUSER: postgres
      PGPASSWORD: synthetic-test-only
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
          cache: npm
      - uses: denoland/setup-deno@v2
        with:
          deno-version: v2.8.1
      - run: npm ci
      - name: Typecheck and adverse calculation cases
        run: |
          deno check supabase/functions/_shared/project-personnel-cost.ts supabase/functions/project-personnel-cost-publish/index.ts
          npx vitest run --config scripts/project-economy/operations-vitest.config.ts
          deno check supabase/functions/catering-project-cost-publish/index.ts
          deno check supabase/functions/finance-project-invoice-receive/index.ts
          deno check supabase/functions/_shared/project-booking-commercial-read.ts supabase/functions/_shared/project-booking-commercial-read-client.ts
          deno test supabase/functions/finance-project-invoice-receive/handler.test.ts
          deno test supabase/functions/_shared/project-credit-link-v2-destination.test.ts
          deno check supabase/functions/finance-project-invoice-receive-v2/index.ts supabase/functions/catering-finance-delivery/index.ts
          deno test supabase/functions/finance-project-invoice-receive-v2/handler.test.ts supabase/functions/finance-project-invoice-receive-v2/receipt.test.ts
      - name: Actual evidence DOM, null costs and actor/tenant cache isolation
        run: npx vitest run --config scripts/project-economy/operations-rendered.config.ts
      - name: Generate actual Operations calculation fixtures
        run: deno run scripts/project-economy/operations-fixture.ts > /tmp/operations-fixtures.json
      - name: Isolated PostgreSQL migration and RPC tests
        run: |
          psql -X -v ON_ERROR_STOP=1 -f scripts/project-economy/operations-postgres-bootstrap.sql
          psql -X -v ON_ERROR_STOP=1 -f supabase/migrations/20261001220652_operations_personnel_cost_evidence.sql
          python3 - <<'PY'
          import subprocess
          from pathlib import Path
          data=Path('/tmp/operations-fixtures.json').read_text().strip()
          subprocess.run(['psql','-X','-v','ON_ERROR_STOP=1','-v','fixture='+data,
                          '-f','scripts/project-economy/operations-postgres-test.sql'],check=True)
          PY
      - name: Destination-scoped invoice receipt, tenant and replay SQL runtime
        run: |
          psql -X -v ON_ERROR_STOP=1 -f scripts/project-economy/operations-invoice-destination-bootstrap.sql
          psql -X -v ON_ERROR_STOP=1 -f supabase/migrations/20261001233744_operations_finance_project_invoice_destination.sql
          psql -X -v ON_ERROR_STOP=1 -f scripts/project-economy/operations-invoice-destination-postgres-test.sql
      - name: Actual outbox lease, receipt and atomicity SQL runtime
        run: |
          psql -X -v ON_ERROR_STOP=1 -f supabase/migrations/20261001225724_operations_personnel_cost_outbox.sql
          psql -X -v ON_ERROR_STOP=1 -f scripts/project-economy/operations-transport-seed.sql
          python3 - <<'PY'
          import subprocess
          from pathlib import Path
          data=Path('/tmp/operations-fixtures.json').read_text().strip()
          subprocess.run(['psql','-X','-v','ON_ERROR_STOP=1','-v','fixture='+data,
                          '-f','scripts/project-economy/operations-outbox-postgres-test.sql'],check=True)
          PY

      - name: Authenticated project review ledger and fingerprint parity
        run: |
          psql -X -v ON_ERROR_STOP=1 -f scripts/project-economy/operations-project-review-bootstrap.sql
          psql -X -v ON_ERROR_STOP=1 -f supabase/migrations/20261001232438_operations_personnel_project_reviews.sql
          psql -X -v ON_ERROR_STOP=1 -f supabase/migrations/20261001234356_operations_personnel_project_review_publications.sql
          psql -X -v ON_ERROR_STOP=1 -f supabase/migrations/20261001235803_operations_personnel_canonical_ingress.sql
          deno run --allow-read scripts/project-economy/operations-project-review-fixture.ts /tmp/operations-fixtures.json > /tmp/project-review-fixtures.json
          python3 - <<'PY'
          import subprocess
          from pathlib import Path
          data=Path('/tmp/project-review-fixtures.json').read_text().strip()
          for name in ['operations-project-review-postgres-test.sql',
                       'operations-project-review-publication-postgres-test.sql',
                       'operations-canonical-ingress-postgres-test.sql']:
              subprocess.run(['psql','-X','-v','ON_ERROR_STOP=1','-v','fixture='+data,
                              '-f','scripts/project-economy/'+name],check=True)
          PY

      - name: Actual authenticated project cost read, correction and withdrawal
        run: |
          psql -X -v ON_ERROR_STOP=1 -f supabase/migrations/20261002001842_operations_project_cost_read.sql
          deno run --allow-read scripts/project-economy/operations-project-cost-read-fixture.ts /tmp/operations-fixtures.json > /tmp/project-cost-read-fixtures.json
          python3 - <<'PY_READ'
          import subprocess
          from pathlib import Path
          data=Path('/tmp/project-cost-read-fixtures.json').read_text().strip()
          subprocess.run(['psql','-X','-v','ON_ERROR_STOP=1','-v','fixture='+data,
                          '-f','scripts/project-economy/operations-project-cost-read-postgres-test.sql'],check=True)
          PY_READ
      - name: Build actual Operations web application
        run: npm run build

      - name: Historical rate enrollment, authorization and immutable saved cost
        run: |
          psql -X -v ON_ERROR_STOP=1 -f supabase/migrations/20261002003928_operations_personnel_historical_rate_admin.sql
          python3 - <<'PY_RATE'
          import subprocess
          from pathlib import Path
          data=Path('/tmp/project-review-fixtures.json').read_text().strip()
          subprocess.run(['psql','-X','-v','ON_ERROR_STOP=1','-v','fixture='+data,
                          '-f','scripts/project-economy/operations-rate-admin-postgres-test.sql'],check=True)
          PY_RATE

      - name: Native Catering calculation, immutable observation and scoped project publication
        run: |
          psql -X -v ON_ERROR_STOP=1 -f scripts/project-economy/operations-catering-bootstrap.sql
          psql -X -v ON_ERROR_STOP=1 -f supabase/migrations/20261001235558_operations_catering_project_evidence.sql
          psql -X -v ON_ERROR_STOP=1 -f scripts/project-economy/operations-catering-postgres-test.sql

      - name: Native-only Catering rate authority and denied project scopes
        run: |
          psql -X -v ON_ERROR_STOP=1 -f supabase/migrations/20261002011313_operations_catering_rate_admin_authority.sql
          psql -X -v ON_ERROR_STOP=1 -f scripts/project-economy/operations-catering-rate-authority-postgres-test.sql
          psql -X -v ON_ERROR_STOP=1 -f scripts/project-economy/operations-catering-project-negatives-postgres-test.sql

      - name: Operations-owned isolated immutable EAC and source lineage
        run: |
          psql -X -v ON_ERROR_STOP=1 -f supabase/migrations/20261002010107_operations_project_forecast_evidence.sql
          deno run --allow-read scripts/project-economy/operations-forecast-fixture.ts /tmp/project-review-fixtures.json > /tmp/project-forecast-fixtures.json
          python3 - <<'PY_FORECAST'
          import subprocess
          from pathlib import Path
          data=Path('/tmp/project-forecast-fixtures.json').read_text().strip()
          subprocess.run(['psql','-X','-v','ON_ERROR_STOP=1','-v','fixture='+data,
                          '-f','scripts/project-economy/operations-forecast-postgres-test.sql'],check=True)
          PY_FORECAST

      - name: Rate-redacted native Catering project read with actual saved publications
        run: |
          psql -X -v ON_ERROR_STOP=1 -f supabase/migrations/20261002023809_operations_project_cost_native_read_v2.sql
          psql -X -v ON_ERROR_STOP=1 -f scripts/project-economy/operations-native-cost-read-postgres-test.sql
      - name: Immutable whole-project membership and authoritative existing relationships
        run: |
          psql -X -v ON_ERROR_STOP=1 -f scripts/project-economy/operations-scope-bootstrap.sql
          psql -X -v ON_ERROR_STOP=1 -f supabase/migrations/20261002014937_operations_project_scope_enrollment.sql
          deno run --allow-read scripts/project-economy/operations-scope-fixture.ts > /tmp/project-scope-fixtures.json
          python3 - <<'PY_SCOPE'
          import subprocess
          from pathlib import Path
          data=Path('/tmp/project-scope-fixtures.json').read_text().strip()
          subprocess.run(['psql','-X','-v','ON_ERROR_STOP=1','-v','fixture='+data,
                          '-f','scripts/project-economy/operations-scope-postgres-test.sql'],check=True)
          PY_SCOPE

      - name: Actual admin local obligation baseline and permanent positive source ownership
        run: |
          psql -X -v ON_ERROR_STOP=1 -f supabase/migrations/20261002023731_operations_project_obligation_authority.sql
          deno run scripts/project-economy/operations-obligation-fixture.ts > /tmp/project-obligation-fixtures.json
          python3 - <<'PY_OBLIGATION'
          import subprocess
          from pathlib import Path
          data=Path('/tmp/project-obligation-fixtures.json').read_text().strip()
          subprocess.run(['psql','-X','-v','ON_ERROR_STOP=1','-v','fixture='+data,
                          '-f','scripts/project-economy/operations-obligation-postgres-test.sql'],check=True)
          PY_OBLIGATION

      - name: Actual admin captured replacement and commitment consumption policy
        run: |
          psql -X -v ON_ERROR_STOP=1 -f supabase/migrations/20261002025617_operations_obligation_source_policy.sql
          python3 - <<'PY_POLICY'
          import subprocess
          from pathlib import Path
          data=Path('/tmp/project-obligation-fixtures.json').read_text().strip()
          subprocess.run(['psql','-X','-v','ON_ERROR_STOP=1','-v','fixture='+data,
                          '-f','scripts/project-economy/operations-source-policy-postgres-test.sql'],check=True)
          PY_POLICY

      - name: Actual whole-scope composition and captured baseline/source currentness
        run: |
          psql -X -v ON_ERROR_STOP=1 -f supabase/migrations/20261002030747_operations_scope_obligation_composition.sql
          python3 - <<'PY_COMPOSITION'
          import subprocess
          from pathlib import Path
          data=Path('/tmp/project-obligation-fixtures.json').read_text().strip()
          subprocess.run(['psql','-X','-v','ON_ERROR_STOP=1','-v','fixture='+data,
                          '-f','scripts/project-economy/operations-scope-composition-postgres-test.sql'],check=True)
          PY_COMPOSITION

      - name: Authenticated exact scope root saved composition and unavailable forecast read
        run: |
          psql -X -v ON_ERROR_STOP=1 -f supabase/migrations/20261002042934_operations_scope_obligation_evidence_read_v1.sql
          python3 - <<'PY_SCOPE_READ'
          import subprocess
          from pathlib import Path
          data=Path('/tmp/project-obligation-fixtures.json').read_text().strip()
          subprocess.run(['psql','-X','-v','ON_ERROR_STOP=1','-v','fixture='+data,
                          '-f','scripts/project-economy/operations-scope-obligation-evidence-read-postgres-test.sql'],check=True)
          PY_SCOPE_READ
      - name: Native v2 recipient economics, replay and cross-protocol currentness
        run: |
          psql -X -v ON_ERROR_STOP=1 -f supabase/migrations/20261002024700_operations_finance_credit_v2_receiver.sql
          psql -X -v ON_ERROR_STOP=1 -f scripts/project-economy/operations-credit-v2-receiver-postgres-test.sql
      - name: Entry-level invoice source barriers preserve v1 and v2 contracts
        run: |
          psql -X -v ON_ERROR_STOP=1 -f supabase/migrations/20261002032702_operations_invoice_economic_source_barriers.sql
          psql -X -v ON_ERROR_STOP=1 -f scripts/project-economy/operations-invoice-barrier-postgres-test.sql
          psql -X -v ON_ERROR_STOP=1 -f scripts/project-economy/operations-invoice-destination-postgres-test.sql
          psql -X -v ON_ERROR_STOP=1 -f scripts/project-economy/operations-credit-v2-receiver-postgres-test.sql
      - name: Native Catering durable Finance capture, lease and unchanged parked source
        run: |
          psql -X -v ON_ERROR_STOP=1 -f supabase/migrations/20261002024013_operations_catering_finance_delivery_v1.sql
          CATERING_PROJECT_ECONOMY_ISOLATED_TEST=true deno run --allow-env scripts/project-economy/catering-finance-fixture.ts > /tmp/catering-finance-fixture.sql
          psql -X -v ON_ERROR_STOP=1 -f /tmp/catering-finance-fixture.sql -f scripts/project-economy/catering-finance-delivery-postgres-test.sql
      - name: Actual authenticated own credit assignment and immutable source relationship proof
        run: |
          psql -X -v ON_ERROR_STOP=1 -f supabase/migrations/20261002035459_operations_obligation_credit_assignment.sql
          python3 - <<'PY_OWN_CREDIT'
          import subprocess
          from pathlib import Path
          data=Path('/tmp/project-obligation-fixtures.json').read_text().strip()
          subprocess.run(['psql','-X','-v','ON_ERROR_STOP=1','-v','fixture='+data,
                          '-f','scripts/project-economy/operations-own-credit-assignment-postgres-test.sql'],check=True)
          PY_OWN_CREDIT
      - name: Actual immutable own credit capacity and retained source reservations
        run: |
          psql -X -v ON_ERROR_STOP=1 -f supabase/migrations/20261002042005_operations_obligation_credit_capacity.sql
          python3 - <<'PY_CAPACITY'
          import subprocess
          from pathlib import Path
          data=Path('/tmp/project-obligation-fixtures.json').read_text().strip()
          subprocess.run(['psql','-X','-v','ON_ERROR_STOP=1','-v','fixture='+data,
                          '-f','scripts/project-economy/operations-credit-capacity-postgres-test.sql'],check=True)
          PY_CAPACITY
      - name: Native Catering protected current rows and persistent opaque withdrawal
        run: |
          psql -X -v ON_ERROR_STOP=1 -f supabase/migrations/20261002035730_operations_catering_project_read_v3.sql
          psql -X -v ON_ERROR_STOP=1 -f scripts/project-economy/operations-catering-project-read-v3-postgres-test.sql
  invoice-source-barrier-native:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    services:
      postgres:
        image: postgres:15.19
        env:
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: synthetic-test-only
          POSTGRES_DB: eventflow_invoice_barrier_runtime
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U postgres"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5
    env:
      PGHOST: 127.0.0.1
      PGPORT: 5432
      PGDATABASE: eventflow_invoice_barrier_runtime
      PGUSER: postgres
      PGPASSWORD: synthetic-test-only
      EVENTFLOW_INVOICE_BARRIER_ISOLATED_DB: 'true'
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - name: Fresh dedicated native invoice barrier concurrency
        run: |
          set -euo pipefail
          for migration in \
            scripts/project-economy/operations-postgres-bootstrap.sql \
            supabase/migrations/20261001220652_operations_personnel_cost_evidence.sql \
            supabase/migrations/20261001225724_operations_personnel_cost_outbox.sql \
            scripts/project-economy/operations-project-review-bootstrap.sql \
            supabase/migrations/20261001232438_operations_personnel_project_reviews.sql \
            scripts/project-economy/operations-scope-bootstrap.sql \
            supabase/migrations/20261002014937_operations_project_scope_enrollment.sql \
            supabase/migrations/20261001233744_operations_finance_project_invoice_destination.sql \
            supabase/migrations/20261002023731_operations_project_obligation_authority.sql \
            supabase/migrations/20261002024700_operations_finance_credit_v2_receiver.sql \
            supabase/migrations/20261002032702_operations_invoice_economic_source_barriers.sql; do
            psql -X -v ON_ERROR_STOP=1 -f "$migration"
          done
          PGOPTIONS='-c eventflow.invoice_barrier_isolated=synthetic-disposable' psql -X -v ON_ERROR_STOP=1 -f scripts/project-economy/operations-invoice-barrier-native-setup.sql
          bash scripts/project-economy/operations-invoice-barrier-native-concurrency.sh
  own-credit-authority-native:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    services:
      postgres:
        image: postgres:15.19
        env:
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: synthetic-test-only
          POSTGRES_DB: eventflow_own_credit_runtime
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U postgres"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5
    env:
      PGHOST: 127.0.0.1
      PGPORT: 5432
      PGDATABASE: eventflow_own_credit_runtime
      PGUSER: postgres
      PGPASSWORD: synthetic-test-only
      EVENTFLOW_OWN_CREDIT_ISOLATED_DB: 'true'
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: denoland/setup-deno@v2
        with:
          deno-version: v2.8.1
      - name: Genuine authenticated own credit source assignment concurrency
        run: |
          set -euo pipefail
          for migration in \
            scripts/project-economy/operations-postgres-bootstrap.sql \
            supabase/migrations/20261001220652_operations_personnel_cost_evidence.sql \
            supabase/migrations/20261001225724_operations_personnel_cost_outbox.sql \
            scripts/project-economy/operations-project-review-bootstrap.sql \
            supabase/migrations/20261001232438_operations_personnel_project_reviews.sql \
            scripts/project-economy/operations-scope-bootstrap.sql \
            supabase/migrations/20261002014937_operations_project_scope_enrollment.sql \
            supabase/migrations/20261001233744_operations_finance_project_invoice_destination.sql \
            supabase/migrations/20261002023731_operations_project_obligation_authority.sql \
            supabase/migrations/20261002024700_operations_finance_credit_v2_receiver.sql \
            supabase/migrations/20261002032702_operations_invoice_economic_source_barriers.sql \
            supabase/migrations/20261002035459_operations_obligation_credit_assignment.sql; do
            psql -X -v ON_ERROR_STOP=1 -f "$migration"
          done
          deno run scripts/project-economy/operations-obligation-fixture.ts > /tmp/own-credit-native-fixture.json
          python3 - <<'PY_NATIVE_OWN'
          import subprocess,os
          from pathlib import Path
          data=Path('/tmp/own-credit-native-fixture.json').read_text().strip()
          subprocess.run(['psql','-X','-v','ON_ERROR_STOP=1','-v','fixture='+data,
                          '-f','scripts/project-economy/operations-own-credit-native-setup.sql'],check=True,
                         env={**os.environ,'PGOPTIONS':'-c eventflow.own_credit_isolated=synthetic-disposable'})
          PY_NATIVE_OWN
          bash scripts/project-economy/operations-own-credit-native-concurrency.sh

  own-credit-capacity-native:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    services:
      postgres:
        image: postgres:15.19
        env:
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: synthetic-test-only
          POSTGRES_DB: eventflow_own_credit_capacity_ci
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U postgres"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5
    env:
      PGHOST: 127.0.0.1
      PGPORT: 5432
      PGDATABASE: eventflow_own_credit_capacity_ci
      PGUSER: postgres
      PGPASSWORD: synthetic-test-only
      EVENTFLOW_CREDIT_CAPACITY_ISOLATED_DB: 'true'
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: denoland/setup-deno@v2
        with:
          deno-version: v2.8.1
      - name: Genuine distinct credit original capacity and source correction concurrency
        run: |
          set -euo pipefail
          for migration in \
            scripts/project-economy/operations-postgres-bootstrap.sql \
            supabase/migrations/20261001220652_operations_personnel_cost_evidence.sql \
            supabase/migrations/20261001225724_operations_personnel_cost_outbox.sql \
            scripts/project-economy/operations-project-review-bootstrap.sql \
            supabase/migrations/20261001232438_operations_personnel_project_reviews.sql \
            scripts/project-economy/operations-scope-bootstrap.sql \
            supabase/migrations/20261002014937_operations_project_scope_enrollment.sql \
