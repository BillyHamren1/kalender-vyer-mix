name: Deploy Scanner read-only pilot

on:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: scanner-read-only-production
  cancel-in-progress: false

jobs:
  deploy:
    name: Configure and deploy signed Planning reader
    runs-on: ubuntu-latest
    timeout-minutes: 35
    env:
      PLANNING_PROJECT_REF: pihrhltinhewhoxefjxv
      BUNDLE_PROJECT_REF: pnvvnvywphfvmwdmqqzs
      BUNDLE_RELEASE_SHA: 4955c0e46f27f141f8b0f7b898ace05c600bbacc
      SCANNER_ALLOWED_ORIGINS: https://scanner-buddy-scan.lovable.app
      BUNDLE_SUPABASE_FUNCTIONS_URL: https://pnvvnvywphfvmwdmqqzs.supabase.co/functions/v1
    steps:
      - name: Check out Planning release
        uses: actions/checkout@v4
        with:
          path: planning

      - name: Require deployment credential
        env:
          SUPABASE_ACCESS_TOKEN: ${{ secrets.SUPABASE_ACCESS_TOKEN }}
        run: test -n "$SUPABASE_ACCESS_TOKEN"

      - name: Verify exact read-only release packages
        working-directory: planning
        shell: bash
        run: |
          set -euo pipefail
          test "$(git rev-parse HEAD)" = "$GITHUB_SHA"
          grep -Fqx "# source commit: $BUNDLE_RELEASE_SHA" \
            supabase/scanner-bundle-projection-release-v1.gitblob
          while read -r expected path; do
            case "$expected" in ""|"#") continue ;; esac
            test "$(git hash-object "$path")" = "$expected"
          done < supabase/scanner-bundle-projection-release-v1.gitblob
          ! grep -Eq "from\\([^)]*\\)\\.(insert|update|upsert|delete)|\\.rpc\\(" \
            supabase/functions/eventflow-scanner-projection-v1/index.ts
          npm ci
          npx eslint \
            supabase/functions/eventflow-scanner-projection-v1/index.ts \
            supabase/functions/_shared/eventflow-scanner-projection-contract.ts \
            supabase/functions/_shared/eventflow-scanner-bundle-contract.ts \
            supabase/functions/_shared/time-bundle-scanner-contract.ts
          npm run build

      - name: Generate isolated release secrets
        id: secrets
        shell: bash
        run: |
          set -euo pipefail
          scanner_token_secret="$(openssl rand -hex 32)"
          bundle_projection_secret="$(openssl rand -hex 32)"
          echo "::add-mask::$scanner_token_secret"
          echo "::add-mask::$bundle_projection_secret"
          echo "scanner_token=$scanner_token_secret" >> "$GITHUB_OUTPUT"
          echo "bundle_projection=$bundle_projection_secret" >> "$GITHUB_OUTPUT"

      - name: Set Bundle projection secret
        env:
          SUPABASE_ACCESS_TOKEN: ${{ secrets.SUPABASE_ACCESS_TOKEN }}
          EVENTFLOW_SCANNER_BUNDLE_SECRET: ${{ steps.secrets.outputs.bundle_projection }}
        run: |
          set -euo pipefail
          npx --yes supabase@2.117.0 secrets set "EVENTFLOW_SCANNER_BUNDLE_SECRET=$EVENTFLOW_SCANNER_BUNDLE_SECRET" --project-ref "$BUNDLE_PROJECT_REF"

      - name: Deploy exact Bundle read-only projection
        working-directory: planning
        env:
          SUPABASE_ACCESS_TOKEN: ${{ secrets.SUPABASE_ACCESS_TOKEN }}
        run: |
          set -euo pipefail
          npx --yes supabase@2.117.0 functions deploy eventflow-scanner-projection-v1 \
            --project-ref "$BUNDLE_PROJECT_REF" \
            --no-verify-jwt

      - name: Set fail-closed Planning secrets
        env:
          SUPABASE_ACCESS_TOKEN: ${{ secrets.SUPABASE_ACCESS_TOKEN }}
          SCANNER_TOKEN_SIGNING_SECRET: ${{ steps.secrets.outputs.scanner_token }}
          EVENTFLOW_SCANNER_BUNDLE_SECRET: ${{ steps.secrets.outputs.bundle_projection }}
          SCANNER_RELEASE_SHA: ${{ github.sha }}
        run: |
          set -euo pipefail
          npx --yes supabase@2.117.0 secrets set "SCANNER_TOKEN_SIGNING_SECRET=$SCANNER_TOKEN_SIGNING_SECRET" "EVENTFLOW_SCANNER_BUNDLE_SECRET=$EVENTFLOW_SCANNER_BUNDLE_SECRET" "BUNDLE_SUPABASE_FUNCTIONS_URL=$BUNDLE_SUPABASE_FUNCTIONS_URL" "SCANNER_ALLOWED_ORIGINS=$SCANNER_ALLOWED_ORIGINS" "SCANNER_RELEASE_SHA=$SCANNER_RELEASE_SHA" --project-ref "$PLANNING_PROJECT_REF"

      - name: Deploy Planning reader before token issuer
        working-directory: planning
        env:
          SUPABASE_ACCESS_TOKEN: ${{ secrets.SUPABASE_ACCESS_TOKEN }}
        run: |
          set -euo pipefail
          npx --yes supabase@2.117.0 functions deploy scanner-api --project-ref "$PLANNING_PROJECT_REF" --no-verify-jwt
          npx --yes supabase@2.117.0 functions deploy mobile-app-auth --project-ref "$PLANNING_PROJECT_REF" --no-verify-jwt

      - name: Verify fail-closed live boundary
        shell: bash
        run: |
          set -euo pipefail
          planning_endpoint="https://$PLANNING_PROJECT_REF.supabase.co/functions/v1/scanner-api"
          bundle_endpoint="https://$BUNDLE_PROJECT_REF.supabase.co/functions/v1/eventflow-scanner-projection-v1"
          allowed_headers="$(mktemp)"
          trap 'rm -f "$allowed_headers"' EXIT

          allowed_status="$(curl --silent --show-error --output /dev/null --dump-header "$allowed_headers" --request OPTIONS \
            --header "Origin: $SCANNER_ALLOWED_ORIGINS" \
            --header 'Access-Control-Request-Method: POST' \
            --header 'Access-Control-Request-Headers: content-type,x-eventflow-scanner-contract' \
            "$planning_endpoint" --write-out '%{http_code}')"
          test "$allowed_status" = "204"
          grep -Fqi "access-control-allow-origin: $SCANNER_ALLOWED_ORIGINS" "$allowed_headers"
          ! grep -Fqi "access-control-allow-origin: *" "$allowed_headers"

          unauthenticated_status="$(curl --silent --show-error --output /dev/null --request POST \
            --header "Origin: $SCANNER_ALLOWED_ORIGINS" \
            --header 'content-type: application/json' \
            --header 'x-eventflow-scanner-contract: scanner_contract_v1' \
            --data '{"action":"list_active_packings","scanner_contract_version":"scanner_contract_v1"}' \
            "$planning_endpoint" --write-out '%{http_code}')"
          test "$unauthenticated_status" = "401"

          unsigned_bundle_status="$(curl --silent --show-error --output /dev/null --request POST --header 'content-type: application/json' --data '{"schema":"eventflow-scanner-bundle-projection-request.v1"}' "$bundle_endpoint" --write-out '%{http_code}')"
          test "$unsigned_bundle_status" = "401"
